<!DOCTYPE html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>Wilder Catú · Portafolio</title>
    <meta
      name="description"
      content="Portafolio de Wilder Catú, Técnico en Desarrollo de Software. Explora su mundo interactivo: habilidades, proyectos, formación y contacto."
    >
    <meta name="theme-color" content="#050712">
    <link rel="icon" href="assets/img/foto-wilder-small.jpg">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/world.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  <body class="loading">
    <a class="skip" href="#content" data-i="ui_skip"></a>

    <!-- Mundo interactivo (decorativo; la información vive en <main>) -->
    <canvas id="world" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <!-- HUD -->
    <header class="hud" id="hud">
      <button class="logo" id="btn-home" type="button" data-i-label="ui_backHome">
        <span aria-hidden="true">&gt;</span> wilder_catu
      </button>

      <p class="zone-indicator" id="zone-indicator" role="status" aria-live="polite">
        <span class="zone-dot" id="zone-dot" aria-hidden="true"></span>
        <span class="zone-label"><span data-i="ui_zone"></span>: <strong id="zone-name"></strong></span>
      </p>

      <p class="score" aria-hidden="true">
        <span data-i="ui_energy"></span> <strong id="score">0</strong>
      </p>

      <div class="tools">
        <button type="button" id="btn-lang" class="tool" data-i-label="ui_langLabel"></button>
        <button type="button" id="btn-calm" class="tool" aria-pressed="false"></button>
        <button type="button" id="btn-text" class="tool" aria-pressed="false"></button>
        <a class="tool" href="sobre-mi.html" id="btn-classic" data-i="ui_classic"></a>
      </div>
    </header>

    <!-- Navegación convencional, siempre disponible -->
    <nav class="dock" id="dock" aria-label="Secciones"></nav>

    <!-- Contenido profesional completo (accesible sin canvas) -->
    <main id="content" tabindex="-1">
      <h1 class="sr-only">Wilder Catú — <span data-i="role"></span></h1>

      <!-- INICIO -->
      <section class="panel panel-hero" id="p-home" data-zone="home" aria-labelledby="t-home" hidden>
        <div class="hero-grid">
          <div class="hero-text">
            <p class="tag"><span data-i="hi"></span></p>
            <h2 id="t-home" class="hero-name">Wilder Catú</h2>
            <p class="tag role" data-i="role"></p>
            <p data-i="hero"></p>
            <div class="row">
              <button class="btn fill" type="button" id="start" data-i="ui_start"></button>
              <button class="btn" type="button" data-go="projects" data-i="seeP"></button>
              <button class="btn" type="button" data-go="path" data-i="seeCV"></button>
            </div>
            <div class="row">
              <a class="btn" href="https://github.com/WilKtu" target="_blank" rel="noopener">GitHub</a>
              <a
                class="btn"
                href="https://www.linkedin.com/in/wilder-fernando-elias-catu-colaj-7a0a8a346"
                target="_blank"
                rel="noopener"
              >LinkedIn</a>
            </div>
            <ul class="howto" aria-label="Controles">
              <li data-i="ui_how1"></li>
              <li data-i="ui_how2"></li>
              <li data-i="ui_how3"></li>
              <li data-i="ui_how4"></li>
            </ul>
          </div>
          <img class="avatar" src="assets/img/foto-wilder.jpg" alt="Wilder Catú" width="280" height="280" decoding="async">
        </div>
      </section>

      <!-- SOBRE MÍ -->
      <section class="panel" id="p-about" data-zone="about" aria-labelledby="t-about" hidden>
        <h2 id="t-about" data-i="aboutT"></h2>
        <p data-i="a1"></p>
        <p data-i="a2"></p>
        <div class="grid">
          <article class="card"><h3 data-i="langT"></h3><p data-i="langv"></p></article>
          <article class="card"><h3 data-i="soft"></h3><p data-i="softv"></p></article>
        </div>
        <h3 data-i="ui_interests"></h3>
        <div class="chips" id="interests"></div>
      </section>

      <!-- HABILIDADES -->
      <section class="panel" id="p-skills" data-zone="skills" aria-labelledby="t-skills" hidden>
        <h2 id="t-skills" data-i="skT"></h2>
        <p class="muted" data-i="ui_skillsHint"></p>
        <div class="grid" id="skills-list"></div>
      </section>

      <!-- PROYECTOS -->
      <section class="panel" id="p-projects" data-zone="projects" aria-labelledby="t-projects" hidden>
        <h2 id="t-projects" data-i="projT"></h2>
        <p data-i="projI"></p>
        <div class="grid" id="proj"></div>
      </section>

      <!-- FORMACIÓN Y CV -->
      <section class="panel" id="p-path" data-zone="path" aria-labelledby="t-path" hidden>
        <h2 id="t-path" data-i="eduT"></h2>
        <ol class="timeline" id="timeline"></ol>
        <h3 data-i="cvT"></h3>
        <p data-i="cvP"></p>
        <div class="row">
          <a class="btn fill" href="assets/cv/Wilder_Catu_CV_ES.pdf" download data-i="dl"></a>
          <a class="btn fill" href="assets/cv/Wilder_Catu_CV_EN.pdf" download data-i="dl2"></a>
          <button class="btn" type="button" id="cv-toggle" aria-expanded="false" aria-controls="cv-frame-wrap"></button>
        </div>
        <div id="cv-frame-wrap" hidden></div>
      </section>

      <!-- VIDA FUERA DEL CÓDIGO -->
      <section class="panel" id="p-life" data-zone="life" aria-labelledby="t-life" hidden>
        <h2 id="t-life" data-i="lifeT"></h2>
        <p data-i="lifeI"></p>
        <div class="grid">
          <article class="card"><h3>⚽ <span data-i="h1"></span></h3><p data-i="h1p"></p></article>
          <article class="card"><h3>🎌 <span data-i="h3"></span></h3><p data-i="h3p"></p></article>
        </div>
        <h3>📚 <span data-i="h2"></span></h3>
        <p data-i="h2p"></p>
        <div class="grid media" id="books"></div>
        <h3>🎮 <span data-i="h4"></span></h3>
        <p data-i="h4p"></p>
        <div class="grid media" id="games"></div>
      </section>

      <!-- CONTACTO -->
      <section class="panel" id="p-contact" data-zone="contact" aria-labelledby="t-contact" hidden>
        <h2 id="t-contact" data-i="ctT"></h2>
        <p data-i="ctP"></p>
        <div class="row" id="contact-links"></div>
      </section>
    </main>

    <!-- Tarjeta rápida al recoger una partícula -->
    <aside class="toast" id="toast" role="status" aria-live="polite" hidden></aside>

    <!-- Ventana informativa -->
    <div class="modal" id="modal" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1">
        <button type="button" class="modal-x" data-close data-i-label="ui_close">×</button>
        <div id="modal-body"></div>
      </div>
    </div>

    <!-- Controles táctiles -->
    <button type="button" class="boost" id="boost" data-i-label="ui_boost" hidden>⚡</button>

    <canvas id="minimap" width="160" height="110" aria-hidden="true"></canvas>

    <noscript>
      <p class="noscript">
        Esta experiencia requiere JavaScript. Puedes consultar la
        <a href="sobre-mi.html">versión clásica</a>.
      </p>
    </noscript>

    <script src="js/data.js"></script>
    <script src="js/responsive.js"></script>
    <script src="js/particles.js"></script>
    <script src="js/snake.js"></script>
    <script src="js/world.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/interactions.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
